apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imagerepositories.codemowers.io
spec:
  group: codemowers.io
  scope: Cluster
  names:
    kind: ImageRepository
    listKind: ImageRepositoryList
    plural: imagerepositories
    singular: imagerepository
    shortNames:
      - imgrepo
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Repository
          type: string
          jsonPath: .spec.repository
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      selectableFields:
        - jsonPath: .spec.repository
      schema:
        openAPIV3Schema:
          description: >-
            An image repository nodes hold images of, without tag or digest,
            such as docker.io/library/nginx. Named <last path segment>-<first
            10 hex digits of the SHA-256 of spec.repository>. Owned by the
            ContainerImages held under it; the garbage collector deletes it
            once they are all gone.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - repository
              properties:
                repository:
                  description: >-
                    Canonical repository: lowercase registry host, docker.io
                    for Docker Hub with library/ for official images.
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: repository is immutable
                source:
                  description: >-
                    Source repository URL for every image in this repository,
                    overriding image metadata. nodestatd preserves it and
                    applies it at its next resync.
                  type: string
