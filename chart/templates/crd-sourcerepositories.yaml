apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sourcerepositories.codemowers.io
spec:
  group: codemowers.io
  scope: Cluster
  names:
    kind: SourceRepository
    listKind: SourceRepositoryList
    plural: sourcerepositories
    singular: sourcerepository
    shortNames:
      - srcrepo
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      selectableFields:
        - jsonPath: .spec.url
      schema:
        openAPIV3Schema:
          description: >-
            A source code repository images on cluster nodes were built from,
            as ContainerImage status.source reports it. Named <last path
            segment>-<first 10 hex digits of the SHA-256 of spec.url>. Owned by
            those ContainerImages; the garbage collector deletes it once they
            are all gone. Not a Flux source.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - url
              properties:
                url:
                  description: Lowercase repository URL without .git suffix or trailing slash.
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: url is immutable
