        mediaType: application/vnd.oci.image.layer.v1.tar+gzip
        size: 4088800
      - digest: sha256:76bbc531cd1771155fe1b2822cdd6cc2e51223af84666bf80fb9d826ccb06d5c
        diffID: sha256:92e56b27d22d7f3712be34b8bdd605331005a5921a8eb50c8b08c51c08abd620
        mediaType: application/vnd.oci.image.layer.v1.tar+gzip
        size: 2615823
    size: 6706189

# Every reference the image is held under on any node.
repoTags:
  - ghcr.io/stefanprodan/podinfo:6.7.0
  - ghcr.io/stefanprodan/podinfo:latest
repoDigests:
  - ghcr.io/stefanprodan/podinfo@sha256:d2b3cd93a48acdc91327533ce28fcb3169b2d9feaf73817dc2eb68858df64edb

nodes:
  # Holds the amd64 manifest under every top-level reference, so manifests,
  # repoTags and repoDigests are inherited.
  - name: worker-1
    pulledAt: "2026-10-22T11:02:41Z"
    # containerd reports the image pinned on this node, whoever pinned it.
    pinned: true
  # Holds only one tag, so its references are listed; an empty list means
  # the node holds the image under no references of that kind.
  - name: worker-2
    manifests:
      - sha256:0060e4fc3052c383ea920673d08388fd6aa3bfc3536932f7c08edd4e4a616520
    repoTags:
      - ghcr.io/stefanprodan/podinfo:6.7.0
    repoDigests: []
    pulledAt: "2026-10-22T09:04:54Z"
    # No container on the node references the image, running or exited.
    unused: true
  - name: arm-1
    manifests:
      - sha256:53d266d18dcd714920b0aed2c54b55d85bbf38ff59b931b4d6f6b6aca0da7e7d
    pulledAt: "2026-10-23T08:44:01Z"
    unused: true
