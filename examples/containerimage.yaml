        size: 2593853
    size: 6219319
  - digest: sha256:53d266d18dcd714920b0aed2c54b55d85bbf38ff59b931b4d6f6b6aca0da7e7d
    mediaType: application/vnd.oci.image.manifest.v1+json
    configDigest: sha256:7ea1fd69fa1ed461175df36f4e9740f4d742108cdffbdfdcd12d737f2cff184d
    architecture: arm64
    # Present when the platform has one, such as arm/v7.
    variant: v8
    created: "2024-06-23T18:31:07Z"
    labels:
      org.opencontainers.image.created: "2024-06-23T18:29:12Z"
    annotations:
      org.opencontainers.image.base.digest: sha256:6a0657acfef760bd9e293361c9b558e98e7d740ed0dffca823d17098a4ffddf5
    layers:
      - digest: sha256:a258b2a6b59a7aa244d8ceab095c7f8df726f27075a69fca7ad8490f3f63148a
